<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Project — Mam123smile</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    code {
      background: rgba(15, 23, 42, 0.8);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">● เชื่อมต่อ GitHub สำเร็จ</div>
    <h1>Mam123smile / test-project</h1>
    <p>
      โครงสร้างโปรเจกต์ตั้งต้นพร้อมใช้งานแล้ว สามารถแก้ไขไฟล์
      <code>index.html</code> หรือ <code>README.md</code> เพื่อทดสอบระบบ Git ได้ทันที
    </p>
  </main>
</body>
</html>
